<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eburon Sandbox Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
        <style>
      /* Rigid Device Viewport Wrapper */
      .device-container {
       width: 100%; max-width: 480px; height: 100vh;
       background-color: #000000; display: flex; flex-direction: column;
       position: relative; overflow: hidden;
      }

      @media (min-width: 480px) {
       .device-container {
        border: 10px solid #16161a; border-radius: 44px;
        height: 92vh; max-height: 900px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
       }
      }

      /* --- Fixed Header Area --- */
      .header {
       background-color: #000000; z-index: 1000; display: flex;
       align-items: center; justify-content: space-between;
       padding: 20px 24px 16px 24px; border-bottom: 1px solid #1f2025; flex-shrink: 0;
      }
      .close-btn { background: none; border: none; color: #ffffff; cursor: pointer; display: flex; align-items: center; opacity: 0.8; transition: opacity 0.2s ease; }
      .close-btn:hover { opacity: 1; }
      .header-title { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.01em; color: #ffffff; }
      .dropdown-pill { background-color: #000000; border: 1px solid #27272a; border-radius: 12px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; }
      .dropdown-pill svg { color: #ffffff; }

      /* --- Main Body Wrapper --- */
      .main-body { flex-grow: 1; display: flex; flex-direction: column; padding: 16px; gap: 16px; overflow: hidden; }

      /* ==================================================
        DOMINANT WORKSPACE CARD
        ================================================== */
      .workspace-card {
       background: linear-gradient(180deg, #121316 0%, #16171b 100%);
       border: 1px solid #1f2025; border-radius: 18px; padding: 20px;
       flex-grow: 1; display: flex; flex-direction: column;
       position: relative; overflow: hidden; min-height: 0;
      }

      /* Subview 1: Initial Ready State */
      .desktop-ready-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; width: 100%; height: 100%; transition: opacity 0.3s ease; }
      .monitor-graphic { width: 160px; display: flex; flex-direction: column; align-items: center; }
      .monitor-screen { width: 100%; aspect-ratio: 16 / 10; background: linear-gradient(135deg, #1e2025 0%, #0d0e12 100%); border: 4px solid #3f3f46; border-radius: 8px; }
      .monitor-inner { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      .monitor-inner::after { content: ""; width: 60%; height: 45%; background: rgba(255, 255, 255, 0.02); border-radius: 4px; }
      .monitor-stand { width: 32px; height: 24px; background-color: #3f3f46; }
      .monitor-base { width: 60px; height: 4px; background-color: #27272a; border-radius: 2px; }
      .desktop-ready-text { color: #71717a; font-size: 1rem; font-weight: 500; }

      /* Subview 2: Document Workspace Viewport */
      .document-workspace { position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity 0.3s ease, transform 0.3s ease; }

      /* State Switchers */
      .workspace-card.gen-mode .desktop-ready-state, .workspace-card.doc-ready .desktop-ready-state { opacity: 0; pointer-events: none; }
      .workspace-card.gen-mode .document-workspace, .workspace-card.doc-ready .document-workspace { opacity: 1; pointer-events: auto; transform: translateY(0); }

      /* Toolbar Header (Inside Workspace) */
      .view-header { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 32px; flex-shrink: 0; }
      .processing-header { font-size: 0.9rem; font-weight: 500; color: #94a3b8; display: flex; align-items: center; gap: 6px; }

      /* Processing Animation */
      .processing-icon { color: #3b82f6; animation: spin 3s linear infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      .dots span { animation: dot-flash 1.4s infinite both; opacity: 0.2; }
      .dots span:nth-child(2) { animation-delay: 0.2s; }
      .dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot-flash { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }

      /* Document Action Buttons */
      .doc-actions { display: none; gap: 8px; }
      .doc-actions .action-btn { display: inline-flex; align-items: center; gap: 6px; background-color: rgba(255, 255, 255, 0.1); color: #f3f4f6; border: 1px solid rgba(255, 255, 255, 0.15); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
      .doc-actions .action-btn:hover { background-color: rgba(255, 255, 255, 0.2); }
      .doc-actions .action-btn.primary { background-color: #3b82f6; border-color: #3b82f6; }
      .doc-actions .action-btn.primary:hover { background-color: #2563eb; }

      .workspace-card.gen-mode .processing-header { display: flex; }
      .workspace-card.doc-ready .processing-header { display: none; }
      .workspace-card.doc-ready .doc-actions { display: flex; margin-left: auto; }

      /* Split Workspace Layout */
      .workspace-split { display: flex; flex-direction: column; height: 100%; gap: 12px; overflow: hidden; }
      .document-panel { flex: 2; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
      
      /* Terminal Panel */
      .terminal-panel { flex: 1; background: #0a0a0c; border: 1px solid #27272a; border-radius: 8px; padding: 12px; font-family: 'Courier New', Courier, monospace; font-size: 0.75rem; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
      .terminal-panel::-webkit-scrollbar { width: 4px; }
      .terminal-panel::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
      .terminal-line { word-break: break-word; line-height: 1.4; }
      .terminal-line.system { color: #71717a; }
      .terminal-line.action { color: #38bdf8; }
      .terminal-line.result { color: #10b981; }
      .terminal-line.error { color: #ef4444; }
      .terminal-cursor { display: inline-block; width: 6px; height: 12px; background: #10b981; animation: blink 1s step-end infinite; vertical-align: middle; margin-left: 4px; }
      @keyframes blink { 50% { opacity: 0; } }

      /* Document Preview Container */
      .document-skeleton { background: #ffffff; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }

      /* -> GENERATION MODE: Blurry loop */
      .workspace-card.gen-mode .document-skeleton { width: 100%; max-width: 200px; padding: 16px; aspect-ratio: 3 / 4; overflow: hidden; animation: blur-loop-generation 10s ease-in-out infinite alternate; }
      @keyframes blur-loop-generation { 0% { filter: blur(22px); opacity: 0.95; transform: scale(0.96); } 100% { filter: blur(4px); opacity: 0.55; transform: scale(1); } }

      /* -> READY MODE: Expanded Document */
      .workspace-card.doc-ready .document-skeleton { animation: none; filter: blur(0); opacity: 1; transform: scale(1); width: 100%; height: 100%; max-width: 100%; aspect-ratio: auto; overflow-y: auto; padding: 24px 32px; background: #f8fafc; scrollbar-width: thin; }
      .workspace-card.doc-ready .document-skeleton::-webkit-scrollbar { width: 6px; }
      .workspace-card.doc-ready .document-skeleton::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

      /* Skeletons */
      .doc-sk-header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
      .doc-sk-icon { width: 14px; height: 14px; border-radius: 3px; background: #3b82f6; }
      .doc-sk-title { height: 6px; width: 60%; background: #64748b; border-radius: 2px; }
      .doc-sk-divider { height: 1px; background: rgba(0, 0, 0, 0.1); width: 100%; margin: 4px 0; }
      .doc-sk-line { height: 4px; background: #e2e8f0; border-radius: 2px; margin-bottom: 6px; }
      .doc-sk-line.short { width: 45%; } .doc-sk-line.medium { width: 75%; } .doc-sk-line.long { width: 100%; }
      .doc-sk-visual { height: 40px; background: rgba(59, 130, 246, 0.05); border: 1px dashed rgba(59, 130, 246, 0.25); border-radius: 4px; margin: 6px 0; }

      /* HTML Render Styling: Micro scale for blur (Gen Mode) */
      .workspace-card.gen-mode .document-skeleton .rendered-document { font-size: 5px; line-height: 1.3; color: #1f2933; font-family: "Helvetica Neue", Arial, sans-serif; }
      .workspace-card.gen-mode .document-skeleton .rendered-document h1 { font-size: 8px; margin-bottom: 4px; color: #0f2742; border-bottom: 1px solid #0f2742; }
      .workspace-card.gen-mode .document-skeleton .rendered-document h2 { font-size: 6px; margin-top: 6px; margin-bottom: 3px; color: #0f2742; border-bottom: 1px solid #d9dee7; }
      .workspace-card.gen-mode .document-skeleton .rendered-document p { font-size: 5px; margin-bottom: 4px; }
      .workspace-card.gen-mode .document-skeleton .rendered-document .meta-grid { display: grid; grid-template-columns: 1fr 1fr; font-size: 4px; gap: 2px; margin-bottom: 6px; }
      .workspace-card.gen-mode .document-skeleton .rendered-document .signature-grid { display: grid; grid-template-columns: 1fr 1fr; margin-top: 8px; gap: 8px; }
      .workspace-card.gen-mode .document-skeleton .rendered-document .signature-box { font-size: 4px; padding-top: 2px; border-top: 1px solid #000; }
      .workspace-card.gen-mode .document-skeleton .rendered-document footer { font-size: 4px; margin-top: 8px; padding-top: 4px; text-align: center; border-top: 1px solid #d9dee7; }

      /* HTML Render Styling: Readable clear scale (Ready Mode) */
      .workspace-card.doc-ready .document-skeleton .rendered-document { font-size: 0.85rem; line-height: 1.5; color: #1f2933; font-family: "Helvetica Neue", Arial, sans-serif; text-align: left; }
      .workspace-card.doc-ready .document-skeleton .rendered-document h1 { font-size: 1.4rem; font-weight: 700; color: #0f2742; border-bottom: 2px solid #0f2742; padding-bottom: 6px; margin-bottom: 14px; text-transform: uppercase; }
      .workspace-card.doc-ready .document-skeleton .rendered-document h2 { font-size: 1rem; font-weight: 700; color: #0f2742; border-bottom: 1px solid #cbd5e1; padding-bottom: 4px; margin-top: 18px; margin-bottom: 8px; text-transform: uppercase; }
      .workspace-card.doc-ready .document-skeleton .rendered-document p { font-size: 0.85rem; margin-bottom: 12px; }
      .workspace-card.doc-ready .document-skeleton .rendered-document strong { font-weight: 700; }
      .workspace-card.doc-ready .document-skeleton .rendered-document ul { margin-left: 20px; margin-bottom: 12px; font-size: 0.85rem; }
      .workspace-card.doc-ready .document-skeleton .rendered-document li { margin-bottom: 6px; }
      .workspace-card.doc-ready .document-skeleton .rendered-document .meta-grid { display: grid; grid-template-columns: 1fr 1fr; font-size: 0.8rem; gap: 8px; margin-bottom: 14px; }
      .workspace-card.doc-ready .document-skeleton .rendered-document .signature-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
      .workspace-card.doc-ready .document-skeleton .rendered-document .signature-box { border-top: 1px solid #000000; padding-top: 6px; font-size: 0.75rem; }
      .workspace-card.doc-ready .document-skeleton .rendered-document footer { font-size: 0.7rem; color: #64748b; text-align: center; margin-top: 24px; border-top: 1px solid #cbd5e1; padding-top: 10px; }

      /* ==================================================
        STICKY COMMAND INPUT BAR
        ================================================== */
      .command-bar { background-color: #0d0e11; border: 1px solid #1a1b1f; border-radius: 14px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
      .cmd-icon { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 50%; }
      .cmd-input-field { background: transparent; border: none; color: #f3f4f6; font-family: inherit; font-size: 0.95rem; outline: none; flex-grow: 1; }
      .cmd-input-field::placeholder { color: #52525b; }
      .cmd-input-field:disabled { color: #52525b; cursor: not-allowed; }

      /* --- Printing Overrides --- */
      @media print {
       body, .header, .command-bar, .desktop-ready-state, .view-header, .terminal-panel { display: none !important; }
       html, body { background-color: #ffffff !important; color: #000000 !important; width: 100% !important; height: auto !important; overflow: visible !important; }
       .device-container { border: none !important; box-shadow: none !important; padding: 0 !important; height: auto !important; overflow: visible !important; }
       .main-body { padding: 0 !important; overflow: visible !important; }
       .workspace-card { padding: 0 !important; border: none !important; background: transparent !important; }
       .document-workspace { position: static !important; padding: 0 !important; }
       .workspace-split { display: block !important; height: auto !important; }
       .document-panel { display: block !important; }
       .document-skeleton { height: auto !important; overflow: visible !important; box-shadow: none !important; border: none !important; padding: 0 !important; }
       @page { size: A4; margin: 20mm; }
      }
    </style>
</head>
<body class="bg-black text-gray-100 h-screen overflow-hidden flex justify-center items-center font-sans">
    <div id="root" class="w-full h-full flex justify-center items-center"></div>
    <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
